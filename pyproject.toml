[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pg-mnemosyne-mcp"
version = "0.1.2"
description = "A Model Context Protocol (MCP) server for PostgreSQL, acting as a super memory and task tracker for AI assistants."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0"
]

[project.scripts]
pg-mnemosyne = "pg_mnemosyne.server:main"
pg_mnemosyne = "pg_mnemosyne.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_mnemosyne"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = ["E722"]
