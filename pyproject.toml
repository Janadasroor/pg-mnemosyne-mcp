[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pg-super-memory-mcp"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for PostgreSQL, acting as a super memory and task tracker for AI assistants."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0"
]

[project.scripts]
pg-super-memory = "pg_super_memory.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_super_memory"]
